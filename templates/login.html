<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Keenetic - Авторизация</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1e293b; padding: 40px; border-radius: 12px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 24px; color: #3b82f6; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #475569; background: #334155; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        .error { color: #ef4444; text-align: center; margin-bottom: 15px; padding: 8px; background: rgba(239, 68, 68, 0.1); border-radius: 6px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Вход в утилиту</h2>
        {{if .}}<div class="error">{{.}}</div>{{end}}
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Имя пользователя" required autocomplete="off">
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Авторизоваться</button>
        </form>
    </div>
</body>
</html>
